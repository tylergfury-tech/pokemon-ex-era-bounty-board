name: One-time header scroll fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-header-scroll.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect top positioning
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path("index.html").read_text(encoding="utf-8")
          css = s[s.find("<style"):s.find("</style>")]
          for m in re.finditer(r"([^{}]+)\\{([^{}]*position\\s*:[^{}]+;[^{}]*)\\}", css):
              print("SELECTOR:", m.group(1).strip())
              print("RULE:", m.group(2).strip())
      - name: Remove sticky top-level UI
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # The table header is intentionally sticky; all other sticky/fixed
          # positioning in the top UI should scroll normally.
          def fix_rule(m):
              selector, body = m.group(1), m.group(2)
              if selector.strip().startswith("th") or " th" in selector:
                  return m.group(0)
              body2 = re.sub(r"position\\s*:\\s*sticky\\s*;", "position: static;", body)
              return selector + "{" + body2 + "}"

          fixed = re.sub(r"([^{}]+)\\{([^{}]*position\\s*:\\s*sticky\\s*;[^{}]*)\\}", fix_rule, s)

          if fixed == s:
              print("No sticky CSS found; leaving file unchanged for diagnosis.")
              raise SystemExit(0)

          p.write_text(fixed, encoding="utf-8")
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-header-scroll.yml
          git add index.html
          git commit -m "fix: let top board controls scroll away"
          git push
